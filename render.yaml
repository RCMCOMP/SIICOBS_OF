# Render Blueprint para SIICOBS Moderno (Todo en Uno)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: siicobs-moderno
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: "SIICOBS Moderno"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          type: web
          name: siicobs-moderno
          property: url
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: demo_bdvampiro.sqlite
